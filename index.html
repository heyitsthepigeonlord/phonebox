<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Phonebox Radio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #phonebox-container {
            position: relative;
            height: 100vh;
            display: none; /* Hidden until Start is clicked */
        }

        #phonebox-bg {
            height: 100%;
            width: auto;
            display: block;
        }

        /* Clickable area mapped over the handset */
        #handset-hotspot {
            position: absolute;
            left: 5%;
            top: 59%;
            width: 14%;
            height: 25%;
            cursor: pointer;
            border-radius: 10px;
            /* Uncomment the line below to see the clickable area during testing */
            /* background-color: rgba(0, 255, 0, 0.3); */ 
        }

        #start-screen {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #d60000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Start Overlay (Required to allow browser audio playback) -->
    <div id="start-screen">
        <button id="start-btn">START</button>
    </div>

    <!-- Main Interactive Area -->
    <div id="phonebox-container">
        <img id="phonebox-bg" src="phonebox.jpg" alt="Telephone Box">
        <div id="handset-hotspot" title="Pick up handset"></div>
    </div>

    <script>
        // File references
        const PLAYLIST_FILE = 'playlist.m3u'; 
        const RINGTONE_FILE = 'ringtone.mp3'; // Replace with your ringing sound file

        // Audio Objects
        const ringAudio = new Audio(RINGTONE_FILE);
        ringAudio.loop = true;
        const stationAudio = new Audio();

        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const phoneboxContainer = document.getElementById('phonebox-container');
        const handset = document.getElementById('handset-hotspot');

        let isRinging = false;
        let stationUrls = [];

        // 1. User clicks start -> Start ringing and show image
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            phoneboxContainer.style.display = 'inline-block';
            
            ringAudio.play().catch(e => console.error("Error playing ringtone:", e));
            isRinging = true;

            // Pre-fetch the playlist while the phone rings
            fetchPlaylist();
        });

        // 2. User clicks handset -> Stop ringing, play random station
        handset.addEventListener('click', () => {
            if (isRinging) {
                ringAudio.pause();
                ringAudio.currentTime = 0;
                isRinging = false;
                playRandomStation();
            } else {
                // Optional: If already listening, clicking again could change the station
                playRandomStation();
            }
        });

        // Fetch and parse the .m3u file
        async function fetchPlaylist() {
            try {
                const response = await fetch(PLAYLIST_FILE);
                if (!response.ok) throw new Error('Playlist not found');
                const text = await response.text();
                
                // Parse out valid URLs (ignoring # comments and empty lines)
                stationUrls = text.split('\n')
                                  .map(line => line.trim())
                                  .filter(line => line.length > 0 && !line.startsWith('#'));
                
            } catch (error) {
                console.error("Could not load playlist:", error);
                alert("Please ensure your .m3u playlist is in the same folder and served via a local web server.");
            }
        }

        // Select a random station and play it
        function playRandomStation() {
            if (stationUrls.length === 0) {
                console.warn("No stations found in playlist.");
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * stationUrls.length);
            const selectedUrl = stationUrls[randomIndex];
            
            stationAudio.src = selectedUrl;
            stationAudio.play().catch(e => console.error("Error playing station:", e));
            console.log("Playing station:", selectedUrl);
        }
    </script>
</body>
</html>
