<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>British Telephone Box Radio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: white;
        }

        /* 3D Scene setup */
        #scene {
            perspective: 1200px;
        }

        /* The Phone Box */
        #phone-box {
            position: relative;
            width: 260px;
            height: 550px;
            background: #a00000;
            border: 10px solid #cc0000;
            border-radius: 10px 10px 0 0;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7), inset 0 0 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
        }

        /* The Telephone Sign */
        .sign {
            background: rgba(255, 255, 255, 0.9);
            color: black;
            text-align: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
            letter-spacing: 3px;
            padding: 10px 0;
            margin: 10px;
            border: 1px solid #333;
        }

        /* Inside the box (Back Wall) */
        .interior {
            position: absolute;
            top: 60px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px black;
        }

        /* The Clickable Telephone */
        #telephone {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.2s;
            text-shadow: 2px 2px 5px black;
        }

        #telephone:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        /* The Door */
        #door {
            position: absolute;
            top: 60px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 70px);
            background: #cc0000;
            transform-origin: left;
            transition: transform 2s ease-in-out;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            border: 2px solid #800000;
        }

        /* Door opening animation */
        #door.open {
            transform: rotateY(-105deg);
        }

        /* Glass Panes on the door */
        .pane {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(0,0,0,0.3);
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.1);
        }

        /* Now Playing UI */
        #now-playing {
            position: absolute;
            bottom: 30px;
            font-size: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 3D Phone Box -->
    <div id="scene">
        <div id="phone-box">
            <div class="sign">TELEPHONE</div>
            
            <div class="interior">
                <div id="telephone" title="Answer the phone">☎️</div>
            </div>
            
            <div id="door">
                <!-- Panes generated by JS -->
            </div>
        </div>
    </div>

    <div id="now-playing">Now Playing: ...</div>

    <script>
        let stationsList = [];

        // 1. Generate Door Panes
        const door = document.getElementById('door');
        for(let i=0; i<24; i++) {
            let pane = document.createElement('div');
            pane.className = 'pane';
            door.appendChild(pane);
        }

        // 2. Audio Setup
        // Using a royalty-free old telephone ring sound
        const ringSound = new Audio('https://actions.google.com/sounds/v1/alarms/phone_ringing.ogg');
        ringSound.loop = true; 
        const radioStream = new Audio();

        // 3. M3U Parser Function
        function parseM3U(data) {
            const lines = data.split('\\n');
            const stations = [];
            let currentName = "Unknown Station";
            
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const splitIndex = line.indexOf(',');
                    if (splitIndex !== -1) {
                        currentName = line.substring(splitIndex + 1).trim();
                    }
                } else if (line.startsWith('http')) {
                    stations.push({ name: currentName, url: line });
                }
            }
            return stations;
        }

        // 4. Load the external .m3u file dynamically
        // IMPORTANT: Make sure 'playlist.m3u' is uploaded to the same folder as this HTML file!
        fetch('playlist.m3u')
            .then(response => response.text())
            .then(data => {
                stationsList = parseM3U(data);
                console.log("Playlist loaded! Found " + stationsList.length + " stations.");
            })
            .catch(error => {
                console.error("Could not load playlist.m3u", error);
            });

        // 5. Trigger on Website Load
        window.addEventListener('load', () => {
            // Open the door immediately
            door.classList.add('open');
            
            // Attempt to play the ringtone immediately
            ringSound.play().catch(e => {
                console.log("Browser blocked autoplay. User must click to enable audio.");
            });
        });

        // 6. Answering the Phone
        const telephone = document.getElementById('telephone');
        const nowPlaying = document.getElementById('now-playing');

        telephone.addEventListener('click', () => {
            if (stationsList.length === 0) {
                alert("Playlist is empty or hasn't loaded yet! Check your playlist.m3u file.");
                return;
            }

            // Stop ringing
            ringSound.pause();
            ringSound.currentTime = 0;

            // Pick a random station
            const randomIndex = Math.floor(Math.random() * stationsList.length);
            const selectedStation = stationsList[randomIndex];

            // Play the radio stream
            radioStream.src = selectedStation.url;
            radioStream.play();

            // Update UI
            nowPlaying.innerText = "🔊 Now Playing: " + selectedStation.name;
            nowPlaying.style.display = 'block';
        });
    </script>
</body>
</html>
